<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 560 596" width="560" height="596" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Which checks fit which phones</title><desc id="fig-desc">Grid of kinds of check against budget, mid-range and flagship phones. Field checks (age, eligibility; a dozen gates), budget: Fits, gate count. Field checks (age, eligibility; a dozen gates), mid: Fits, gate count. Field checks (age, eligibility; a dozen gates), flagship: Fits, gate count. Device key plus two field checks (OpenAC Show on its own), budget: Fits, under 1s. Device key plus two field checks (OpenAC Show on its own), mid: Fits, under 1s. Device key plus two field checks (OpenAC Show on its own), flagship: Fits, under 1s. Eight checks in one proof (coordination network), budget: Fits, 9.1s. Eight checks in one proof (coordination network), mid: Fits, 2.8s. Eight checks in one proof (coordination network), flagship: Fits, 1.9s. P-256 signature alone (UltraHonk), budget: Fits, 3.0s. P-256 signature alone (UltraHonk), mid: Fits, 1.1s. P-256 signature alone (UltraHonk), flagship: Fits, under 1s. SHA-256 over 2 KB (UltraHonk), budget: Fits, 10s. SHA-256 over 2 KB (UltraHonk), mid: Fits, 3.2s. SHA-256 over 2 KB (UltraHonk), flagship: Fits, 2.2s. SHA-256 over 2 KB (Spartan2, OpenAC&#x27;s prover), budget: Fits, 3.6s. SHA-256 over 2 KB (Spartan2, OpenAC&#x27;s prover), mid: Fits, 1.3s. SHA-256 over 2 KB (Spartan2, OpenAC&#x27;s prover), flagship: Fits, 1.1s. Checking a whole SD-JWT (OpenAC Prepare, per credential), budget: Tight, 1 of 3 killed. Checking a whole SD-JWT (OpenAC Prepare, per credential), mid: Fits, 5.1s. Checking a whole SD-JWT (OpenAC Prepare, per credential), flagship: Fits, 3.5s. Re-randomizing Prepare&#x27;s proof (every OpenAC presentation), budget: Tight, 5.9s. Re-randomizing Prepare&#x27;s proof (every OpenAC presentation), mid: Fits, 1.9s. Re-randomizing Prepare&#x27;s proof (every OpenAC presentation), flagship: Fits, 1.3s.</desc>
<style>
.viz { --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#73716b; --grid:#e1e0d9; --axis:#c3c2b7; --band:#e6e5de;
  --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
.faded { opacity:.35; }
.bg { fill:var(--surface); } .t { fill:var(--ink); font-size:17px; font-weight:600; }
.sub { fill:var(--ink2); font-size:13px; } .lab { fill:var(--ink); font-size:14px; }
.hdr { fill:var(--ink); font-size:14px; font-weight:600; } .grp { fill:var(--ink2); font-size:13px; font-weight:600; }
.tick { fill:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; } .note { fill:var(--muted); font-size:13px; }
.grid { stroke:var(--grid); stroke-width:1; } .axis { stroke:var(--axis); stroke-width:1; }
.ref { stroke:var(--ink2); stroke-width:1.5; } .s1 { fill:var(--s1); } .s2 { fill:var(--s2); }
.ring { stroke:var(--surface); stroke-width:2; } .x { stroke:var(--ink); stroke-width:2; }
.o1 { fill:none; stroke:var(--s1); stroke-width:1.5; } .o2 { fill:none; stroke:var(--s2); stroke-width:1.5; }
.band { fill:var(--band); stroke:var(--axis); stroke-width:1; }
</style>
<style>
.viz { --ok:#2f8f6b; --warn:#b7791f; --bad:#c8402f; }
.chip-ok { fill:var(--ok); fill-opacity:.16; stroke:var(--ok); stroke-width:1.5; }
.chip-warn { fill:var(--warn); fill-opacity:.18; stroke:var(--warn); stroke-width:1.5; }
.chip-bad { fill:var(--bad); fill-opacity:.18; stroke:var(--bad); stroke-width:1.5; }
.chip-none { fill:none; stroke:var(--axis); stroke-width:1.5; stroke-dasharray:4 3; }
.cell { fill:var(--ink2); font-size:13px; }
</style>
<style>
.box { fill:var(--surface); stroke-width:1.5; } .b1 { stroke:var(--s1); } .b2 { stroke:var(--s2); }
.b0 { stroke:var(--axis); stroke-dasharray:4 4; } .tint { fill:var(--s2); fill-opacity:.14; }
.arrow { stroke:var(--ink2); stroke-width:1.5; } .ah { fill:var(--ink2); }
.small { fill:var(--ink2); font-size:14px; } .strong { fill:var(--ink); font-size:15px; font-weight:600; }
.limit { stroke:var(--ink2); stroke-width:1; stroke-dasharray:3 3; } .miss { fill:var(--grid); opacity:.6; }
.inbar { fill:#ffffff; font-size:15px; font-weight:600; }
</style>
