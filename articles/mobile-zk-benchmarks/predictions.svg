<circle class="s2 ring" cx="222.7" cy="250.0" r="6"><title>OpenAC presentation, low-end: 7.0 s measured, 6.9 s predicted</title></circle>
<circle class="s2 ring" cx="474.5" cy="250.0" r="6"><title>OpenAC presentation, low-end: 1.93 GiB measured, 1.45 GiB predicted</title></circle>
