<circle class="s1 ring" cx="460.2" cy="194.0" r="6"><title>Coordination network presentation, flagship: 0.45 GiB measured, 0.38 GiB predicted</title></circle>
<text class="grp" x="16.0" y="232.0" text-anchor="start">OpenAC presentation</text>
