<line class="limit" x1="519.4" y1="238" x2="519.4" y2="310"/>
<text class="tick" x="366.6" y="330.0" text-anchor="middle">0.5x</text>
<text class="tick" x="443.0" y="330.0" text-anchor="middle">1x</text>
<text class="tick" x="519.4" y="330.0" text-anchor="middle">2x</text>
<text class="grp" x="16.0" y="128.0" text-anchor="start">Coordination network presentation</text>
<text class="lab" x="16.0" y="151.0" text-anchor="start">Low-end</text>
<circle class="s1 ring" cx="238.4" cy="146.0" r="6"><title>Coordination network presentation, low-end: 9.1 s measured, 7.8 s predicted</title></circle>
<circle class="s1 ring" cx="495.4" cy="146.0" r="6"><title>Coordination network presentation, low-end: 0.62 GiB measured, 0.38 GiB predicted</title></circle>
