<circle class="s2 ring" cx="213.3" cy="274.0" r="6"><title>OpenAC presentation, mid-range: 2.5 s measured, 2.7 s predicted</title></circle>
<circle class="s2 ring" cx="464.4" cy="274.0" r="6"><title>OpenAC presentation, mid-range: 1.76 GiB measured, 1.45 GiB predicted</title></circle>
