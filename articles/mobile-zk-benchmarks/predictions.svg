<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 560 378" width="560" height="378" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Laptop predictions against the phones</title><desc id="fig-desc">Dot plot of measured divided by predicted, on a log scale with dashed lines at half and double, for repeat time and peak memory of the two presentations, per tier. All dots fall between the dashed lines. Times sit close to 1 on every tier. Memory sits above 1 on every tier.</desc>
<style>
.viz { --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#73716b; --grid:#e1e0d9; --axis:#c3c2b7; --band:#e6e5de;
  --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
.faded { opacity:.35; }
.bg { fill:var(--surface); } .t { fill:var(--ink); font-size:17px; font-weight:600; }
.sub { fill:var(--ink2); font-size:13px; } .lab { fill:var(--ink); font-size:14px; }
.hdr { fill:var(--ink); font-size:14px; font-weight:600; } .grp { fill:var(--ink2); font-size:13px; font-weight:600; }
.tick { fill:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; } .note { fill:var(--muted); font-size:13px; }
.grid { stroke:var(--grid); stroke-width:1; } .axis { stroke:var(--axis); stroke-width:1; }
.ref { stroke:var(--ink2); stroke-width:1.5; } .s1 { fill:var(--s1); } .s2 { fill:var(--s2); }
.ring { stroke:var(--surface); stroke-width:2; } .x { stroke:var(--ink); stroke-width:2; }
.o1 { fill:none; stroke:var(--s1); stroke-width:1.5; } .o2 { fill:none; stroke:var(--s2); stroke-width:1.5; }
.band { fill:var(--band); stroke:var(--axis); stroke-width:1; }
</style>
<style>
.box { fill:var(--surface); stroke-width:1.5; } .b1 { stroke:var(--s1); } .b2 { stroke:var(--s2); }
.b0 { stroke:var(--axis); stroke-dasharray:4 4; } .tint { fill:var(--s2); fill-opacity:.14; }
.arrow { stroke:var(--ink2); stroke-width:1.5; } .ah { fill:var(--ink2); }
.small { fill:var(--ink2); font-size:14px; } .strong { fill:var(--ink); font-size:15px; font-weight:600; }
.limit { stroke:var(--ink2); stroke-width:1; stroke-dasharray:3 3; }
.inbar { fill:#ffffff; font-size:15px; font-weight:600; }
</style>
<rect class="bg" width="560" height="378" rx="8"/>
<text class="t" x="16.0" y="34.0" text-anchor="start">Laptop predictions against the phones</text>
<text class="sub" x="16.0" y="56.0" text-anchor="start">Measured ÷ predicted. Time sat near 1x, and memory came in above it.</text>
<text class="hdr" x="221.0" y="92.0" text-anchor="middle">Repeat time</text>
<text class="hdr" x="443.0" y="92.0" text-anchor="middle">Peak memory</text>
<line class="limit" x1="144.6" y1="134" x2="144.6" y2="206"/>
<line class="ref" x1="221.0" y1="134" x2="221.0" y2="206"/>
<line class="limit" x1="297.4" y1="134" x2="297.4" y2="206"/>
<line class="limit" x1="144.6" y1="238" x2="144.6" y2="310"/>
<line class="ref" x1="221.0" y1="238" x2="221.0" y2="310"/>
<line class="limit" x1="297.4" y1="238" x2="297.4" y2="310"/>
<text class="tick" x="144.6" y="330.0" text-anchor="middle">0.5x</text>
<text class="tick" x="221.0" y="330.0" text-anchor="middle">1x</text>
<text class="tick" x="297.4" y="330.0" text-anchor="middle">2x</text>
<line class="limit" x1="366.6" y1="134" x2="366.6" y2="206"/>
<line class="ref" x1="443.0" y1="134" x2="443.0" y2="206"/>
<line class="limit" x1="519.4" y1="134" x2="519.4" y2="206"/>
<line class="limit" x1="366.6" y1="238" x2="366.6" y2="310"/>
