<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 560 654" width="560" height="654" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Peak memory per phone</title><desc id="fig-desc">Dot plot of peak app memory for three workloads. Each 4 GB phone has its own lane with a band for its free memory before the runs and a line at 2 GiB; mid-range and flagship phones share a lane per tier. The coordination network peaks at 0.4 to 0.6 GiB. OpenAC presentations peak at 1.7 to 2.0 GiB on nine phones and 1.3 GiB on the Infinix SMART 8; Prepare at 1.5 to 2.8 GiB, the highest on a 12 GB Galaxy S23 Ultra. The Galaxy A06, with 1.3 to 1.6 GiB free, was killed during Prepare at about 2.2 GiB.</desc>
<style>
.viz { --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#73716b; --grid:#e1e0d9; --axis:#c3c2b7; --band:#e6e5de;
  --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
.faded { opacity:.35; }
.bg { fill:var(--surface); } .t { fill:var(--ink); font-size:17px; font-weight:600; }
.sub { fill:var(--ink2); font-size:13px; } .lab { fill:var(--ink); font-size:14px; }
.hdr { fill:var(--ink); font-size:14px; font-weight:600; } .grp { fill:var(--ink2); font-size:13px; font-weight:600; }
.tick { fill:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; } .note { fill:var(--muted); font-size:13px; }
.grid { stroke:var(--grid); stroke-width:1; } .axis { stroke:var(--axis); stroke-width:1; }
.ref { stroke:var(--ink2); stroke-width:1.5; } .s1 { fill:var(--s1); } .s2 { fill:var(--s2); }
.ring { stroke:var(--surface); stroke-width:2; } .x { stroke:var(--ink); stroke-width:2; }
.o1 { fill:none; stroke:var(--s1); stroke-width:1.5; } .o2 { fill:none; stroke:var(--s2); stroke-width:1.5; }
.band { fill:var(--band); stroke:var(--axis); stroke-width:1; }
</style>
