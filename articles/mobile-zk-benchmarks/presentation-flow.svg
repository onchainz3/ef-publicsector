<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 560 708" width="560" height="708" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">What runs when, in each system</title><desc id="fig-desc">Two columns. The coordination network signs its credential for proofs, has no per-credential step, and makes one proof of eight checks per presentation. That proof answers a fresh request from the verifier, takes 8 to 10 seconds on a low-end phone and peaks at 0.4 to 0.6 GiB, and the verifier checks it with a 3.7 KB key. OpenAC starts from an SD-JWT. Prepare runs once per credential, in 15 to 35 seconds on a low-end phone: it hashes and parses the token, checks the issuer&#x27;s signature, picks two claim fields and saves 67 MB of state. Each presentation makes a Show proof of the device key and up to two checks, for the verifier&#x27;s request, which takes under 1 second on most low-end phones and about 0.3 GiB on its own. It also re-randomizes the Prepare proof, so verifiers can&#x27;t link two presentations, which takes 5.4 to 7.2 seconds on a low-end phone and peaks at 1.7 to 2.0 GiB. Last, it re-randomizes the Show proof to match, which takes under half a second on most low-end phones. The verifier checks both proofs and the link between them, with about 437 MB of keys.</desc>
<style>
