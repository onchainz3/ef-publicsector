<text class="grp" x="16.0" y="333.0" text-anchor="start">Every presentation: the user waits</text>
<rect class="box b1" x="16" y="343" width="256" height="178" rx="6"/>
<text class="strong" x="28.0" y="366.0" text-anchor="start">One proof</text>
<text class="small" x="260.0" y="366.0" text-anchor="end">8 to 10s</text>
<rect class="tag" x="28" y="379" width="114" height="19" rx="9.5"/>
<text class="tagt" x="85.0" y="393.0" text-anchor="middle">Issuer signed</text>
<rect class="tag" x="146" y="379" width="114" height="19" rx="9.5"/>
<text class="tagt" x="203.0" y="393.0" text-anchor="middle">Issuer approved</text>
<rect class="tag" x="28" y="404" width="114" height="19" rx="9.5"/>
<text class="tagt" x="85.0" y="418.0" text-anchor="middle">Validity check</text>
<rect class="tag" x="146" y="404" width="114" height="19" rx="9.5"/>
<text class="tagt" x="203.0" y="418.0" text-anchor="middle">Predicate check</text>
<rect class="tag" x="28" y="429" width="114" height="19" rx="9.5"/>
<text class="tagt" x="85.0" y="443.0" text-anchor="middle">Device key</text>
<rect class="tag" x="146" y="429" width="114" height="19" rx="9.5"/>
