<svg xmlns="http://www.w3.org/2000/svg" class="viz" viewBox="0 0 560 433" width="560" height="433" role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">What fits in one app&#x27;s share of a 4 GB phone</title><desc id="fig-desc">Three columns on one scale against a dashed line at about 2 GiB, one app&#x27;s share of a 4 GB phone. Small proof, OpenAC Show: 0.3 GiB. Medium proof, Coordination network: 0.6 GiB. Large proof, OpenAC presentation: 1.9 GiB. A cross marks OpenAC&#x27;s Prepare on the Galaxy A06, killed by Android at 2.2 GiB.</desc>
<style>
.viz { --surface:#ffffff; --ink:#0b0b0b; --ink2:#52514e; --muted:#73716b; --grid:#e1e0d9; --axis:#c3c2b7; --band:#e6e5de;
  --s1:#2a78d6; --s2:#eb6834; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
.faded { opacity:.35; }
.bg { fill:var(--surface); } .t { fill:var(--ink); font-size:17px; font-weight:600; }
.sub { fill:var(--ink2); font-size:13px; } .lab { fill:var(--ink); font-size:14px; }
.hdr { fill:var(--ink); font-size:14px; font-weight:600; } .grp { fill:var(--ink2); font-size:13px; font-weight:600; }
.tick { fill:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; } .note { fill:var(--muted); font-size:13px; }
.grid { stroke:var(--grid); stroke-width:1; } .axis { stroke:var(--axis); stroke-width:1; }
.ref { stroke:var(--ink2); stroke-width:1.5; } .s1 { fill:var(--s1); } .s2 { fill:var(--s2); }
.ring { stroke:var(--surface); stroke-width:2; } .x { stroke:var(--ink); stroke-width:2; }
.o1 { fill:none; stroke:var(--s1); stroke-width:1.5; } .o2 { fill:none; stroke:var(--s2); stroke-width:1.5; }
.band { fill:var(--band); stroke:var(--axis); stroke-width:1; }
</style>
<style>
.box { fill:var(--surface); stroke-width:1.5; } .b1 { stroke:var(--s1); } .b2 { stroke:var(--s2); }
.b0 { stroke:var(--axis); stroke-dasharray:4 4; } .tint { fill:var(--s2); fill-opacity:.14; }
.arrow { stroke:var(--ink2); stroke-width:1.5; } .ah { fill:var(--ink2); }
.small { fill:var(--ink2); font-size:14px; } .strong { fill:var(--ink); font-size:15px; font-weight:600; }
.limit { stroke:var(--ink2); stroke-width:1; stroke-dasharray:3 3; } .miss { fill:var(--grid); opacity:.6; }
.inbar { fill:#ffffff; font-size:15px; font-weight:600; }
</style>
<rect class="bg" width="560" height="433" rx="8"/>
<text class="t" x="16.0" y="34.0" text-anchor="start">What fits in one app&#x27;s share of a 4 GB phone</text>
<line class="ref" x1="16" y1="118.0" x2="544" y2="118.0" stroke-dasharray="5 4"/>
<text class="small" x="16.0" y="138.0" text-anchor="start">one app&#x27;s share, about 2 GiB</text>
<line class="axis" x1="16" y1="318.0" x2="544" y2="318.0"/>
<rect class="s2" x="50.0" y="291.2" width="108.0" height="26.8" rx="4"/>
<text class="strong" x="104.0" y="283.2" text-anchor="middle">0.3 GiB</text>
<text class="hdr" x="104.0" y="340.0" text-anchor="middle">Small</text>
<text class="small" x="104.0" y="359.0" text-anchor="middle">OpenAC Show</text>
<rect class="s1" x="226.0" y="256.1" width="108.0" height="61.9" rx="4"/>
<text class="strong" x="280.0" y="248.1" text-anchor="middle">0.6 GiB</text>
<text class="hdr" x="280.0" y="340.0" text-anchor="middle">Medium</text>
<text class="small" x="280.0" y="359.0" text-anchor="middle">Coordination network</text>
<rect class="s2" x="402.0" y="125.2" width="108.0" height="192.8" rx="4"/>
<text class="inbar" x="456.0" y="149.2" text-anchor="middle">1.9 GiB</text>
<text class="hdr" x="456.0" y="340.0" text-anchor="middle">Large</text>
<text class="small" x="456.0" y="359.0" text-anchor="middle">OpenAC presentation</text>
<path class="x" d="M450.0,96.5 l12,12 m0,-12 l-12,12"/>
<text class="small" x="442.0" y="107.5" text-anchor="end">Prepare on the A06, killed at 2.2 GiB</text>
<text class="note" x="16.0" y="411.0" text-anchor="start">Highest peak on our three 4 GB phones.</text>
</svg>